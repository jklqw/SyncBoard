user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # Connection header must be conditional: "upgrade" only for real WebSocket handshakes.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=syncboard_api:10m rate=12r/s;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    types_hash_max_size 2048;
    server_tokens      off;
    keepalive_timeout  65;
    client_max_body_size 6m;   # 5 MiB upload cap + multipart overhead
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss application/svg+xml
                      application/manifest+json image/svg+xml;

    # Brotli is shipped as an optional drop-in: copy docker/nginx/brotli.conf.disabled
    # to /etc/nginx/brotli.d/brotli.conf in an image that includes ngx_brotli.
    # A wildcard include is harmless when the directory is empty.
    include /etc/nginx/brotli.d/*.conf;

    upstream syncboard_server {
        server server:3000;
        keepalive 32;
    }

    upstream syncboard_web {
        server web:8080;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        http2 on;                       # nginx >= 1.25.1 (h2c until TLS is terminated here)
        server_name _;

        # ---- Defense in depth: headers applied to every response -----------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ---- Liveness for Compose / orchestrators -------------------------------
        location = /health/nginx {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- Yjs WebSocket gateway (binary frames, long-lived) -----------------
        location /ws/ {
            proxy_pass http://syncboard_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- REST API, auth, uploads, exports ----------------------------------
        location /api/ {
            limit_req zone=syncboard_api burst=24 nodelay;
            limit_req_status 429;
            proxy_pass http://syncboard_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /health {
            proxy_pass http://syncboard_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Static SPA is served internally by the unprivileged web image.
        location / {
            proxy_pass http://syncboard_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # TLS termination can be enabled by mounting certs into /etc/nginx/certs and
    # uncommenting this block. Security headers above are inherited by this server
    # only when repeated or hoisted into the http context; keep them in sync.
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name board.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_session_cache shared:SSL:10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     ... same locations as above ...
    # }
}
